# Cut a release from a v* tag: static musl binaries attached to the GitHub
# release, plus a multi-arch image on GHCR.
#
# Each arch builds natively on its own runner (no cross-compiling: aws-lc-sys
# needs a true musl cross toolchain), mirroring build_and_test.yaml. The
# per-arch jobs push single-platform images by digest; the manifest job then
# stitches them into one multi-arch tag with `imagetools create`.
#
# NOTE: authored in a sandbox without GitHub Actions access; the build steps
# mirror the exercised CI workflow, but this workflow itself is not tested.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Create release for tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

  build:
    name: Build ${{ matrix.arch }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      - name: Build static binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package and upload binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=k8s-sidecar-rs-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$NAME"
          cp target/${{ matrix.target }}/release/k8s-sidecar-rs "$NAME/"
          cp README.md "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          gh release upload "$GITHUB_REF_NAME" "$NAME.tar.gz" "$NAME.tar.gz.sha256" --clobber

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile wraps a host-built binary, so stage a context holding
      # just the two files (same shape as `make rust-image` and CI).
      - name: Stage image context
        run: |
          mkdir -p /tmp/ctx
          cp Dockerfile /tmp/ctx/
          cp target/${{ matrix.target }}/release/k8s-sidecar-rs /tmp/ctx/

      - name: Push image by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: /tmp/ctx
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  manifest:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME#v}"
