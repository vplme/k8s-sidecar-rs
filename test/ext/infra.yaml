# Namespaces, RBAC and the shared script ConfigMap for the extended suite.
# Two namespaces so NAMESPACE=ALL and comma-separated namespace lists can be
# exercised against real cross-namespace behaviour.
apiVersion: v1
kind: Namespace
metadata:
  name: ext-a
---
apiVersion: v1
kind: Namespace
metadata:
  name: ext-b
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ext-role
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "watch", "list"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ext-acc
  namespace: ext-a
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ext-acc
  namespace: ext-b
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ext-rolebind
roleRef:
  kind: ClusterRole
  name: ext-role
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: ext-acc
  namespace: ext-a
- kind: ServiceAccount
  name: ext-acc
  namespace: ext-b
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ext-script
  namespace: ext-a
data:
  # Appends one line per invocation to a volume the inspector can read, so the
  # suite can count how many times files_changed actually fired.
  script.sh: |-
    #!/bin/sh
    echo "SCRIPT_RAN" >> /out/script.log
